spring.application.name=sportrent
server.port=8080

# Путь к JSON-файлу хранения (использует модуль storage, для Дамира)
sportrent.storage.path=data/sportrent.json

# Срок аренды только целое число
spring.jackson.deserialization.accept-float-as-int=false


# Даты как ISO-8601 строки
spring.jackson.serialization.write-dates-as-timestamps=false

# Не показывать stack trace и внутренние сообщения пользователю
server.error.include-stacktrace=never
server.error.include-message=never
