<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SportRent: история и отчёты</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/history.css">
</head>
<body>
<header class="site-header">
    <h1>SportRent</h1>
    <nav>
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="pricing.html">Калькулятор</a>
        <a href="rentals.html">Аренды</a>
        <a href="history.html" class="active">История и отчёты</a>
    </nav>
</header>
<main class="container">
    <h2>История и отчёты</h2>
    <div id="message" class="hidden"></div>

    <section class="summary" id="summary"></section>
    <p class="note">Сумма — это стоимость всех оформленных аренд, а не фактически полученная выручка: учёт оплаты не ведётся.</p>

    <div class="toolbar">
        <label for="statusFilter">Статус</label>
        <select id="statusFilter">
            <option value="">Все</option>
            <option value="ACTIVE">Активные</option>
            <option value="COMPLETED">Завершённые</option>
        </select>
        <a class="button-link" href="/api/reports/rentals.txt" download>Скачать TXT-отчёт</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>Оформлена</th>
            <th>Клиент</th>
            <th>Предмет</th>
            <th>Срок</th>
            <th>Итого</th>
            <th>Статус</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="rentalsBody"></tbody>
    </table>
    <p id="emptyNote" class="note hidden">Аренд не найдено.</p>

    <section id="details" class="details hidden"></section>
</main>
<script src="js/api.js"></script>
<script src="js/history.js"></script>
</body>
</html>
